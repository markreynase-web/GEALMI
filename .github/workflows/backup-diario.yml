# .github/workflows/backup-diario.yml
# Fase 3, Eje "Brecha competitiva" -- Nivel 1 (Urgente): backup automático
# real, no manual. Corre lejos de Render a propósito: el servicio de
# backend en Render no trae pg_dump (contenedor Node estándar) y su disco
# es efímero -- cualquier archivo que se guardara ahí se perdería en el
# próximo redeploy o reinicio. Un runner de GitHub Actions sí puede instalar
# postgresql-client, y su artifact de salida vive en almacenamiento de
# GitHub, fuera del servidor -- exactamente el "almacenamiento externo" que
# ya pide backend/BACKUP.md.
#
# Reutiliza scripts/backup.js tal cual (cero cambios) -- ese script no tiene
# dependencias npm, solo necesita Node + pg_dump en el PATH.
#
# Versión de pg_dump: el paquete "postgresql-client" genérico de Ubuntu
# instala la versión de sus propios repos (16.x), pero la base real
# (Supabase) corre PostgreSQL 17 -- pg_dump se niega a respaldar un
# servidor MÁS NUEVO que él mismo (mismo motivo por el que el entorno de
# desarrollo local tiene instalado específicamente v17, no cualquier
# versión -- ver BACKUP.md). Por eso acá se agrega el repositorio oficial
# de PGDG y se instala "postgresql-client-17" a propósito, no el genérico.
#
# Secreto requerido (Settings -> Secrets and variables -> Actions):
#   PROD_DATABASE_URL -- la URL de conexión de producción. Nunca se loguea
#   completa (el propio script solo imprime host/nombre de base).

name: Backup diario de la base de datos

on:
  schedule:
    # 08:00 UTC = 03:00 hora Perú (UTC-5) -- tráfico bajo.
    - cron: '0 8 * * *'
  # Permite disparar una corrida manual desde la pestaña Actions, para
  # probar el workflow sin esperar al cron.
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar postgresql-client-17 (trae pg_dump 17, misma versión que el servidor)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Ejecutar el backup
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npm run backup

      - name: Subir el backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: gealmi-backup-${{ github.run_id }}
          path: backend/backups/*.dump
          retention-days: 30
          if-no-files-found: error
