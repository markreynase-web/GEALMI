<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEALMI — Auditoría</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/panel-lateral.css">
<!-- PWA instalable (Nivel 3 del roadmap) -- rutas absolutas, funcionan
     igual desde la raíz que desde pages/. sw.js se registra en js/sesion.js
     (importado por todas las páginas), no acá. -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GEALMI">
<link rel="apple-touch-icon" href="/assets/brand/gealmi-apple-touch.png">
</head>
<body data-modulo="auditoria">

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="topbarTitle">Auditoría</h1>
        <div class="topbar-subtitle">QUIÉN HIZO QUÉ, Y CUÁNDO</div>
      </div>
      <div class="topbar-search" id="topbarSearch"></div>
      <div id="sesionWidget" class="sesion-widget"></div>
    </header>

    <div class="toolbar">
      <div class="toolbar-left">
        <select class="period" id="filtroModulo">
          <option value="">Todos los módulos</option>
          <option value="ventas">Ventas</option>
          <option value="inventario">Inventario</option>
          <option value="clientes">Clientes</option>
          <option value="finanzas">Finanzas</option>
          <option value="postventa">Postventa</option>
          <option value="vehiculos">Vehículos</option>
          <option value="repuestos">Repuestos</option>
          <option value="usuarios">Usuarios</option>
        </select>
        <select class="period" id="filtroAccion">
          <option value="">Todas las acciones</option>
          <option value="crear">Creó</option>
          <option value="editar">Editó</option>
          <option value="eliminar">Eliminó</option>
          <option value="importar">Importó</option>
          <option value="impersonar">Soporte</option>
        </select>
      </div>
      <div class="toolbar-right">
        <div class="date-range">
          <input type="date" class="period" id="fechaDesde" title="Desde">
          <span>→</span>
          <input type="date" class="period" id="fechaHasta" title="Hasta">
        </div>
        <button class="btn btn-ochre" id="btnBuscarAuditoria">Buscar</button>
      </div>
    </div>

    <main>
      <div class="panel buscador-panel">
        <div class="buscador-grande">
          <span class="buscador-icono">🔍</span>
          <input type="text" id="auditoriaBuscador" placeholder="Buscar por usuario, módulo o qué pasó…">
        </div>
      </div>

      <section class="panel">
        <h3 style="margin-bottom:4px;">Registro de actividad <span class="tag" id="auditoriaCount">—</span></h3>
        <div style="font-size:12px; color:var(--muted); margin-bottom:14px;">Del más reciente al más antiguo. Clic en un evento para ver el detalle completo.</div>
        <div id="auditoriaLista">Cargando…</div>
      </section>
    </main>

    <footer></footer>
  </div>
</div>

<script type="module">
import { cargarConfigEmpresa } from '../js/config.js';
import { renderSidebar } from '../components/sidebar.js';
import { renderTopbar } from '../components/topbar.js';
import { renderFooter } from '../components/footer.js';
import { obtenerSesion, tienePermiso, haySesionActiva } from '../js/sesion.js';
import { escapeHtml } from '../js/utils.js';
import { abrirPanelLateral } from '../components/panelLateral.js';

if (!haySesionActiva()) location.replace('login');

let config;
let eventosCache = [];

const ETIQUETA_MODULO = {
  ventas: 'una venta', inventario: 'un producto', clientes: 'un cliente',
  finanzas: 'un movimiento', usuarios: 'un usuario',
  postventa: 'una orden de servicio', vehiculos: 'un vehículo', repuestos: 'un repuesto',
  superadmin: 'soporte técnico',
  auth: 'seguridad de la cuenta'
};

// Color del marcador/badge de cada acción -- reutiliza los mismos tokens
// semánticos que ya usa el resto del rediseño (verde=positivo/crear,
// rojo=peligro/eliminar), así "eliminar" se lee como lo más delicado sin
// depender solo del texto.
const ETIQUETA_ACCION = {
  crear: { texto: 'Creó', color: 'teal' },
  editar: { texto: 'Editó', color: 'blue' },
  eliminar: { texto: 'Eliminó', color: 'danger' },
  importar: { texto: 'Importó', color: 'purple' },
  impersonar: { texto: 'Soporte', color: 'purple' },
  // Verificación en dos pasos (2FA) -- ver routes/twoFactor.js, routes/auth.js
  // y POST /usuarios/:id/reset-2fa.
  activar_2fa: { texto: 'Activó 2FA', color: 'teal' },
  desactivar_2fa: { texto: 'Desactivó 2FA', color: 'danger' },
  reset_2fa: { texto: 'Restableció 2FA', color: 'purple' },
  login_2fa_fallo: { texto: 'Código 2FA fallido', color: 'danger' },
  usar_cod_recup: { texto: 'Código de recuperación', color: 'purple' }
};

const DESCRIPCION_2FA = {
  activar_2fa: 'Activó la verificación en dos pasos de su cuenta.',
  desactivar_2fa: 'Desactivó la verificación en dos pasos de su cuenta.',
  login_2fa_fallo: 'Escribió un código de verificación incorrecto al iniciar sesión.',
  usar_cod_recup: 'Inició sesión con un código de recuperación (no tenía a mano su app).'
};

function formatoFechaHora(iso) {
  const d = new Date(iso);
  return d.toLocaleString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// Nombre o texto identificador de un objeto de detalle (venta, producto,
// cliente, movimiento...) -- cada módulo usa un campo distinto para "el
// nombre de la cosa", se prueban en orden hasta encontrar uno.
function nombrePrincipal(obj) {
  if (!obj || typeof obj !== 'object') return null;
  return obj.nombre || obj.producto || obj.cliente || obj.concepto || obj.email || null;
}

// Arma una oración en español a partir de fila+detalle, en vez de mostrar
// el JSON crudo -- eso queda atrás del botón "Más información". Cubre las
// 4 formas de "detalle" que arma el backend (crear/editar/eliminar/importar,
// ver crudFactory.js y las rutas de ventas/finanzas/inventario) más un
// respaldo genérico para lo que no encaje (ej. datos de prueba con acciones
// como "iniciar_sesion" que no vienen de este código).
function generarDescripcion(f) {
  const modulo = ETIQUETA_MODULO[f.modulo] || `un registro de ${f.modulo}`;
  const detalle = f.detalle;

  if (f.accion === 'crear') {
    const nombre = nombrePrincipal(detalle);
    return `Creó ${modulo}${nombre ? `: "${nombre}"` : ` #${f.registro_id ?? '—'}`}.`;
  }
  if (f.accion === 'eliminar') {
    const nombre = nombrePrincipal(detalle?.eliminado || detalle);
    return `Eliminó ${modulo}${nombre ? `: "${nombre}"` : ` #${f.registro_id ?? '—'}`}.`;
  }
  if (f.accion === 'editar') {
    if (typeof detalle === 'string') return detalle;
    if (detalle && typeof detalle === 'object') {
      const cambios = Object.entries(detalle)
        .filter(([, v]) => v && typeof v === 'object' && 'antes' in v && 'despues' in v)
        .map(([campo, v]) => `${campo} de "${v.antes ?? '—'}" a "${v.despues ?? '—'}"`);
      if (cambios.length) return `Editó ${modulo}: cambió ${cambios.join(', ')}.`;
    }
    return `Editó ${modulo} #${f.registro_id ?? '—'}.`;
  }
  if (f.accion === 'importar') {
    const ins = detalle?.insertadas ?? '—';
    const err = detalle?.errores || 0;
    return `Importó ${ins} fila(s) a ${modulo}${err ? `, ${err} con error` : ''}.`;
  }
  // Inicio de una sesión de impersonación (ver POST
  // /superadmin/empresas/:id/impersonar) -- se audita bajo esta misma
  // empresa a propósito, para que sus usuarios vean cuándo entró soporte y
  // por qué, no solo quede en un log interno.
  if (f.accion === 'impersonar') {
    const motivo = detalle?.motivo;
    return `Un representante de soporte técnico entró a esta cuenta${motivo ? `: "${motivo}"` : '.'}`;
  }
  if (DESCRIPCION_2FA[f.accion]) return DESCRIPCION_2FA[f.accion];
  // Un admin le restableció el 2FA a otra persona: registro_id es esa persona.
  if (f.accion === 'reset_2fa') return `Restableció la verificación en dos pasos del usuario #${f.registro_id ?? '—'}.`;
  return detalle ? `${f.accion} en ${f.modulo}.` : `${f.accion} en ${f.modulo} (sin más detalle disponible).`;
}

// El "detalle" que arma el backend no tiene una sola forma -- es un dump
// crudo de campos reales (ver registroAuditoria.js y sus call sites), no
// prosa escrita a mano. Esta función cubre las formas que existen hoy:
// diff por campo ({campo:{antes,despues}}), objeto completo antes/después
// (postventa.js), un "eliminado" anidado, o texto plano -- con un volcado
// genérico de respaldo para lo que no encaje en ninguna.
function renderDetalle(detalle) {
  if (detalle === null || detalle === undefined) return '<div class="rank-row">Sin información adicional.</div>';
  if (typeof detalle === 'string') return `<div class="rank-row">${escapeHtml(detalle)}</div>`;
  if (typeof detalle !== 'object') return `<div class="rank-row">${escapeHtml(String(detalle))}</div>`;

  const base = (detalle.eliminado && typeof detalle.eliminado === 'object') ? detalle.eliminado : detalle;

  if (base.antes && base.despues && typeof base.antes === 'object' && typeof base.despues === 'object') {
    const campos = [...new Set([...Object.keys(base.antes), ...Object.keys(base.despues)])]
      .filter(c => JSON.stringify(base.antes[c]) !== JSON.stringify(base.despues[c]));
    return campos.length
      ? campos.map(c => `<div class="rank-row"><span class="rank-name">${escapeHtml(c)}</span><span class="rank-val" style="font-weight:400; font-size:12px;">${escapeHtml(String(base.antes[c] ?? '—'))} → ${escapeHtml(String(base.despues[c] ?? '—'))}</span></div>`).join('')
      : '<div class="rank-row">Sin cambios detectables.</div>';
  }

  const entradasDiff = Object.entries(base).filter(([, v]) => v && typeof v === 'object' && 'antes' in v && 'despues' in v);
  if (entradasDiff.length) {
    return entradasDiff.map(([campo, v]) => `<div class="rank-row"><span class="rank-name">${escapeHtml(campo)}</span><span class="rank-val" style="font-weight:400; font-size:12px;">${escapeHtml(String(v.antes ?? '—'))} → ${escapeHtml(String(v.despues ?? '—'))}</span></div>`).join('');
  }

  const entradas = Object.entries(base);
  return entradas.length
    ? entradas.map(([k, v]) => `<div class="rank-row"><span class="rank-name">${escapeHtml(k)}</span><span class="rank-val" style="font-weight:400; font-size:12px;">${escapeHtml(typeof v === 'object' ? JSON.stringify(v) : String(v))}</span></div>`).join('')
    : '<div class="rank-row">Sin información adicional.</div>';
}

function abrirDetalleEvento(f) {
  abrirPanelLateral({
    titulo: 'Detalle del evento',
    icono: '🔍',
    montar: (body) => {
      body.innerHTML = `
        <div class="perfil-cliente-contacto">
          <div>👤 ${escapeHtml(f.usuario_nombre || 'Desconocido')}</div>
          <div>🕒 ${escapeHtml(formatoFechaHora(f.creado_el))}</div>
          <div>${escapeHtml(ETIQUETA_MODULO[f.modulo] || f.modulo)}${f.registro_id ? ` · Registro #${escapeHtml(String(f.registro_id))}` : ''}</div>
        </div>
        <div class="rank-row" style="border-bottom:2px solid var(--paper-line); margin-bottom:10px; padding-bottom:12px;">
          <span class="rank-name" style="font-weight:600;">${escapeHtml(generarDescripcion(f))}</span>
        </div>
        <h4 class="perfil-cliente-subtitulo">Qué cambió</h4>
        ${renderDetalle(f.detalle)}
      `;
    }
  });
}

function dibujarEventos(filas) {
  const cont = document.getElementById('auditoriaLista');
  document.getElementById('auditoriaCount').textContent = `${filas.length} evento(s)`;

  cont.innerHTML = filas.length ? filas.map(f => {
    const accion = ETIQUETA_ACCION[f.accion] || { texto: f.accion, color: 'muted' };
    return `<div class="evento-fila" data-id="${f.id}">
      <span class="evento-marca evento-marca-${accion.color}"></span>
      <div class="evento-info">
        <div class="evento-desc">${escapeHtml(generarDescripcion(f))}</div>
        <div class="evento-meta">${escapeHtml(f.usuario_nombre || 'Desconocido')} · ${escapeHtml(ETIQUETA_MODULO[f.modulo] || f.modulo)}${f.via_impersonacion ? ' · <b style="color:#8A5A00;">🔒 vía soporte</b>' : ''}</div>
      </div>
      <span class="evento-badge evento-badge-${accion.color}">${escapeHtml(accion.texto)}</span>
      <span class="evento-fecha">${escapeHtml(formatoFechaHora(f.creado_el))}</span>
    </div>`;
  }).join('') : '<div class="rank-row">Sin eventos para estos filtros.</div>';

  cont.querySelectorAll('.evento-fila').forEach(el => {
    el.addEventListener('click', () => {
      const f = filas.find(x => String(x.id) === el.dataset.id);
      if (f) abrirDetalleEvento(f);
    });
  });
}

// Acción y texto libre filtran client-side sobre lo ya traído del backend
// (que ya filtró por módulo/fecha) -- evita un viaje al servidor por cada
// letra que se escribe en el buscador.
function aplicarFiltrosClientSide() {
  const accion = document.getElementById('filtroAccion').value;
  const texto = document.getElementById('auditoriaBuscador').value.trim().toLowerCase();
  const filtrados = eventosCache.filter(f => {
    if (accion && f.accion !== accion) return false;
    if (texto) {
      const compuesto = `${f.usuario_nombre || ''} ${ETIQUETA_MODULO[f.modulo] || f.modulo} ${generarDescripcion(f)}`.toLowerCase();
      if (!compuesto.includes(texto)) return false;
    }
    return true;
  });
  dibujarEventos(filtrados);
}

async function cargarAuditoria() {
  const cont = document.getElementById('auditoriaLista');
  cont.innerHTML = 'Cargando…';

  const sesion = obtenerSesion();
  const qs = new URLSearchParams();
  const modulo = document.getElementById('filtroModulo').value;
  const desde = document.getElementById('fechaDesde').value;
  const hasta = document.getElementById('fechaHasta').value;
  if (modulo) qs.set('modulo', modulo);
  if (desde) qs.set('desde', desde);
  if (hasta) qs.set('hasta', hasta);

  try {
    const res = await fetch(`${config.apiBaseUrl}/auditoria?${qs}`, { headers: { Authorization: `Bearer ${sesion.token}` } });
    if (!res.ok) { cont.innerHTML = '<p class="tabla-vacia">No se pudo leer el registro de actividad (¿tienes permiso?).</p>'; return; }
    eventosCache = await res.json();
  } catch {
    cont.innerHTML = '<p class="tabla-vacia">No se pudo conectar con el backend.</p>';
    return;
  }

  aplicarFiltrosClientSide();
}

(async function iniciar() {
  config = await cargarConfigEmpresa();
  renderSidebar(config, 'auditoria');
  await renderTopbar(config);
  renderFooter();

  if (!tienePermiso('auditoria.ver')) {
    document.getElementById('auditoriaLista').innerHTML = '<p class="tabla-vacia">Tu rol no tiene permiso para ver esta sección.</p>';
    return;
  }

  document.getElementById('btnBuscarAuditoria').addEventListener('click', cargarAuditoria);
  document.getElementById('filtroAccion').addEventListener('change', aplicarFiltrosClientSide);
  document.getElementById('auditoriaBuscador').addEventListener('input', aplicarFiltrosClientSide);
  cargarAuditoria();
})();
</script>
</body>
</html>
