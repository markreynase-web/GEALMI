<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEALMI — Clientes</title>

<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/panel-lateral.css">

<!-- Librerías de terceros: se cargan como globales (Chart, Papa, JSZip) -->
<script src="../lib/chart.js"></script>
<script src="../lib/papaparse.min.js"></script>
<script src="../lib/jszip.min.js"></script>
<!-- PWA instalable (Nivel 3 del roadmap) -- rutas absolutas, funcionan
     igual desde la raíz que desde pages/. sw.js se registra en js/sesion.js
     (importado por todas las páginas), no acá. -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0E1B45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GEALMI">
<link rel="apple-touch-icon" href="/assets/logo-icon.png">
</head>
<body data-modulo="clientes">

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="topbarTitle">Clientes</h1>
        <div class="topbar-subtitle" id="topbarSubtitle"></div>
      </div>
      <div class="topbar-search" id="topbarSearch"></div>
      <div id="sesionWidget" class="sesion-widget"></div>
    </header>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="vista-tabs" id="vistaTabs" style="display:none;">
          <button type="button" class="vista-tab activo" data-vista="ejecutiva">📊 Vista Ejecutiva</button>
          <button type="button" class="vista-tab" data-vista="operativa">🗂️ Vista Operativa</button>
        </div>
      </div>
      <div class="toolbar-right">
        <div class="date-range" id="dateRangeWrap" style="display:none;">
          <input type="date" class="period" id="fechaDesde" title="Desde">
          <span>→</span>
          <input type="date" class="period" id="fechaHasta" title="Hasta">
          <button class="btn btn-ghost" id="resetRangoBtn" title="Ver todo el periodo">Todo</button>
        </div>
        <button class="btn btn-ghost" id="exportPdfBtn">Exportar PDF</button>
        <button class="btn btn-ochre" id="uploadBtn">Cargar CSV o ZIP</button>
        <button class="btn btn-ghost" id="clearStorageBtn" style="display:none;" title="Borra los datos guardados en este navegador">Borrar datos guardados</button>
        <input type="file" id="fileInput" accept=".csv,.zip" />
      </div>
    </div>
    <div id="uploadStatus" style="font-size:12px; color:var(--muted); padding:0 32px;"></div>

    <div class="print-only" id="printHeader">
      <h1 id="printBizName"></h1>
      <div id="printMeta"></div>
    </div>

    <section class="panel captura-panel" id="capturaSection" style="display:none; margin:0 32px 20px;">
      <div class="captura-header">
        <h3>Registros</h3>
        <div class="captura-header-acciones">
          <button type="button" class="btn btn-ochre" id="btnNuevoRegistro">+ Nuevo</button>
          <button type="button" class="btn btn-ghost" id="btnImportarCSVDB">Importar CSV</button>
          <input type="file" id="fileInputImportDB" accept=".csv" style="display:none;">
        </div>
      </div>
      <span id="importDBStatus" class="form-status"></span>
      <div id="tablaCaptura"></div>
    </section>

    <main>
      <div class="panel periodo-bar">
        <div class="periodo-tabs" id="clientesPeriodoTabs">
          <button type="button" class="periodo-tab activo" data-periodo="mes">Este mes</button>
          <button type="button" class="periodo-tab" data-periodo="30d">Últimos 30 días</button>
          <button type="button" class="periodo-tab" data-periodo="anio">Este año</button>
        </div>
      </div>

      <div class="kpis" id="clientesKpis"></div>

      <div class="panel" style="margin-bottom:20px;">
        <h3>Segmentos</h3>
        <div class="segmento-chips" id="clientesSegmentos"></div>
      </div>

      <div class="panel">
        <h3>Clientes <span class="tag">Clic para ver el perfil</span></h3>
        <div id="clientesLista"></div>
      </div>

      <div class="secundarios-grid" style="margin-top:20px;">
        <div class="sec-chart-panel">
          <h4>Distribución por segmento <span class="tag">Proporción</span></h4>
          <div class="chart-wrap" id="clientesChartSegmentoWrap" style="height:200px;"><canvas id="clientesChartSegmento"></canvas></div>
        </div>
        <div class="sec-chart-panel">
          <h4>Clientes nuevos por mes <span class="tag">Últimos 12 meses</span></h4>
          <div class="chart-wrap" id="clientesChartNuevosWrap" style="height:200px;"><canvas id="clientesChartNuevos"></canvas></div>
        </div>
        <div class="sec-chart-panel">
          <h4>Valor promedio por segmento <span class="tag">Comparación</span></h4>
          <div class="chart-wrap" id="clientesChartValorWrap" style="height:200px;"><canvas id="clientesChartValor"></canvas></div>
        </div>
        <div class="sec-chart-panel">
          <h4>Frecuencia de compra <span class="tag">Distribución</span></h4>
          <div class="chart-wrap" id="clientesChartFrecuenciaWrap" style="height:200px;"><canvas id="clientesChartFrecuencia"></canvas></div>
        </div>
      </div>
    </main>

    <footer>
      <b>GEALMI</b> · Clientes
    </footer>
  </div>
</div>

<!-- app.js es un módulo ES: importa utils/parsing/storage/filters/charts/dashboard.
     Requiere servidor local (no funciona con doble clic / file://). -->
<script type="module" src="../js/app.js"></script>
</body>
</html>
