<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEALMI — GEALMI AI</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/gealmi-ai.css">
<!-- PWA instalable (Nivel 3 del roadmap) -- rutas absolutas, funcionan
     igual desde la raíz que desde pages/. sw.js se registra en js/sesion.js
     (importado por todas las páginas), no acá. -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0E1B45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GEALMI">
<link rel="apple-touch-icon" href="/assets/logo-icon.png">
</head>
<body data-modulo="gealmi_ai">

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="topbarTitle">GEALMI AI</h1>
        <div class="topbar-subtitle" id="topbarSubtitle">TU ASISTENTE EMPRESARIAL</div>
      </div>
      <div class="topbar-search" id="topbarSearch"></div>
      <div id="sesionWidget" class="sesion-widget"></div>
    </header>

    <main>
      <div id="aiNoDisponible" class="panel" style="display:none; padding:28px; text-align:center;"></div>

      <div class="ai-layout" id="aiLayout">
        <aside class="ai-lista panel" id="aiLista" aria-label="Tus conversaciones">
          <button type="button" class="btn btn-ochre ai-nueva" id="aiNueva">＋ Nueva conversación</button>
          <div class="ai-conversaciones" id="aiConversaciones" role="list">
            <div class="ai-conv-vacia">Cargando…</div>
          </div>
          <p class="ai-privacidad">Tus conversaciones se guardan solo para ti y puedes borrarlas cuando quieras.</p>
        </aside>

        <section class="ai-chat panel" id="aiChat" aria-label="Chat con GEALMI AI">
          <div class="ai-chat-cabecera">
            <button type="button" class="btn btn-ghost ai-toggle-lista" id="aiToggleLista" aria-expanded="false">☰ Conversaciones</button>
            <h2 class="ai-titulo" id="aiTitulo">Nueva conversación</h2>
            <button type="button" class="icon-btn" id="aiRenombrar" title="Renombrar conversación" aria-label="Renombrar conversación" style="display:none;">✏️</button>
          </div>
          <div class="ai-mensajes" id="aiMensajes" aria-live="polite"></div>
          <div class="ai-error" id="aiError" role="alert" hidden></div>
          <form class="ai-form" id="aiForm">
            <textarea id="aiInput" rows="1" maxlength="1000" placeholder="Pregúntale a GEALMI AI…" aria-label="Tu pregunta"></textarea>
            <button type="submit" class="btn btn-ochre" id="aiEnviar">Enviar</button>
          </form>
          <div class="ai-pie">
            <span id="aiContador">0 / 1000</span>
            <span>GEALMI AI usa tus datos reales, pero puede equivocarse: verifica las cifras importantes.</span>
          </div>
        </section>
      </div>
    </main>

    <footer></footer>
  </div>
</div>

<script type="module">
import { cargarConfigEmpresa, buscarModulo } from '../js/config.js';
import { renderSidebar } from '../components/sidebar.js';
import { renderTopbar } from '../components/topbar.js';
import { renderFooter } from '../components/footer.js';
import { tienePermiso, haySesionActiva } from '../js/sesion.js';
import { escapeHtml } from '../js/utils.js';
import { ICONO_SPARK } from '../js/iconos.js';
import { renderizarMarkdown } from '../js/markdownLite.js';
import { tiempoRelativo } from '../js/notificaciones.js';
import {
  listarConversaciones, obtenerConversacion, renombrarConversacion, eliminarConversacion, preguntarGealmiAi
} from '../js/gealmiAi.js';

if (!haySesionActiva()) location.replace('login');

const MAX_PREGUNTA = 1000;
const $ = (id) => document.getElementById(id);

// Nombre legible de cada herramienta de datos ("Consulté: Ventas, Alertas de stock").
const ETIQUETA_HERRAMIENTA = {
  resumen_ventas: 'Ventas', tendencia_ventas_mensual: 'Tendencia de ventas', alertas_stock: 'Alertas de stock',
  productos_baja_rotacion: 'Baja rotación', velocidad_de_venta_de_producto: 'Ritmo de venta',
  resumen_finanzas: 'Finanzas', top_clientes: 'Mejores clientes', detectar_anomalias_ventas: 'Días atípicos'
};

// Preguntas de ejemplo: solo las de datos que ESTA persona puede ver (la IA no le daría el resto).
const SUGERENCIAS = [
  { permiso: 'ventas.ver', textos: ['¿Cómo van las ventas este mes?', 'Compara este mes con el anterior.', '¿Cuáles son mis productos más vendidos?'] },
  { permiso: 'inventario.ver', textos: ['¿Qué productos tienen stock bajo?', '¿Qué debería reponer pronto?'] },
  { permiso: 'finanzas.ver', textos: ['Dame un resumen financiero.', '¿En qué estoy gastando más?'] },
  { permiso: 'clientes.ver', textos: ['¿Cuál fue mi mejor cliente este mes?'] }
];

let config;
let conversaciones = [];
let actual = { id: null, titulo: 'Nueva conversación', mensajes: [] };
let enviando = false;

function sugerenciasActuales() {
  const propias = SUGERENCIAS.filter(s => tienePermiso(s.permiso)).flatMap(s => s.textos);
  return propias.length ? propias.slice(0, 6) : ['¿Qué puedes hacer por mi negocio?'];
}

// ---------- Lista ----------

function pintarLista() {
  const cont = $('aiConversaciones');
  if (!conversaciones.length) {
    cont.innerHTML = '<div class="ai-conv-vacia">Aún no tienes conversaciones. Escribe tu primera pregunta.</div>';
    return;
  }
  cont.innerHTML = conversaciones.map(c => `
    <div class="ai-conv${c.id === actual.id ? ' activa' : ''}" role="listitem" data-id="${c.id}">
      <button type="button" class="ai-conv-abrir" data-accion="abrir" title="${escapeHtml(c.titulo)}">
        <span class="ai-conv-titulo">${escapeHtml(c.titulo)}</span>
        <span class="ai-conv-fecha">${tiempoRelativo(c.actualizada_el)}</span>
      </button>
      <button type="button" class="ai-conv-borrar" data-accion="borrar" title="Eliminar conversación" aria-label="Eliminar conversación ${escapeHtml(c.titulo)}">🗑️</button>
    </div>`).join('');
}

async function cargarLista() {
  try {
    conversaciones = await listarConversaciones();
    pintarLista();
  } catch (err) {
    $('aiConversaciones').innerHTML = `<div class="ai-conv-vacia">${escapeHtml(err.message)}</div>`;
  }
}

// ---------- Mensajes ----------

function burbuja(m) {
  if (m.rol === 'user') return `<div class="ai-msg user">${escapeHtml(m.texto)}</div>`;
  const fuentes = m.herramientas?.length
    ? `<span>Consulté: ${m.herramientas.map(h => escapeHtml(ETIQUETA_HERRAMIENTA[h] || h)).join(', ')}</span>` : '';
  return `
    <div class="ai-msg asistente">
      <div class="md">${renderizarMarkdown(m.texto)}</div>
      <div class="ai-msg-pie">${fuentes}<button type="button" class="ai-copiar" data-accion="copiar">Copiar</button></div>
    </div>`;
}

function pintarMensajes() {
  const cont = $('aiMensajes');
  if (!actual.mensajes.length) {
    cont.innerHTML = `
      <div class="ai-bienvenida">
        <div class="ai-bienvenida-icono">${ICONO_SPARK}</div>
        <h3>Hola, soy GEALMI AI</h3>
        <p>Consulto los datos reales de tu empresa para responderte: ventas, inventario, finanzas y clientes. Pregúntame lo que necesites.</p>
        <div class="ai-chips">${sugerenciasActuales().map(t => `<button type="button" class="ai-chip">${escapeHtml(t)}</button>`).join('')}</div>
      </div>`;
  } else {
    cont.innerHTML = actual.mensajes.map(burbuja).join('');
  }
  cont.scrollTop = cont.scrollHeight;
}

function mostrarEscribiendo() {
  $('aiMensajes').insertAdjacentHTML('beforeend', '<div class="ai-msg asistente" id="aiEscribiendo"><div class="ai-escribiendo" aria-label="GEALMI AI está escribiendo"><span></span><span></span><span></span></div></div>');
  $('aiMensajes').scrollTop = $('aiMensajes').scrollHeight;
}

function pintarCabecera() {
  $('aiTitulo').textContent = actual.titulo;
  $('aiRenombrar').style.display = actual.id ? '' : 'none';
}

function mostrarError(texto) {
  const el = $('aiError');
  el.textContent = texto ? `⚠️ ${texto}` : '';
  el.hidden = !texto;
}

function pintarTodo() {
  pintarCabecera();
  pintarMensajes();
  pintarLista();
  mostrarError('');
}

// ---------- Acciones ----------

function nuevaConversacion() {
  actual = { id: null, titulo: 'Nueva conversación', mensajes: [] };
  pintarTodo();
  cerrarListaMovil();
  $('aiInput').focus();
}

async function abrirConversacion(id) {
  try {
    const c = await obtenerConversacion(id);
    actual = { id: c.id, titulo: c.titulo, mensajes: c.mensajes.map(m => ({ rol: m.rol, texto: m.texto, herramientas: m.herramientas })) };
    pintarTodo();
    cerrarListaMovil();
  } catch (err) {
    mostrarError(err.message);
    if (err.status === 404) cargarLista();
  }
}

async function enviar(pregunta) {
  if (enviando || !pregunta.trim()) return;
  enviando = true;
  mostrarError('');
  const input = $('aiInput');
  const boton = $('aiEnviar');
  input.disabled = true; boton.disabled = true;
  actual.mensajes.push({ rol: 'user', texto: pregunta });
  pintarMensajes();
  mostrarEscribiendo();
  input.value = '';
  ajustarAlto();
  actualizarContador();
  try {
    const r = await preguntarGealmiAi(pregunta, actual.id);
    actual.id = r.conversacion_id;
    actual.titulo = r.titulo;
    actual.mensajes.push({ rol: 'assistant', texto: r.respuesta, herramientas: r.herramientas_usadas });
    pintarCabecera();
    pintarMensajes();
    await cargarLista();
  } catch (err) {
    // No quedó guardado nada en el servidor: se quita la burbuja provisional y se devuelve el texto para reintentar.
    actual.mensajes.pop();
    pintarMensajes();
    input.value = pregunta;
    ajustarAlto();
    actualizarContador();
    mostrarError(err.message);
  } finally {
    enviando = false;
    input.disabled = false; boton.disabled = false;
    input.focus();
  }
}

function iniciarRenombrado() {
  if (!actual.id) return;
  const h2 = $('aiTitulo');
  const campo = document.createElement('input');
  campo.type = 'text'; campo.className = 'ai-titulo-input'; campo.value = actual.titulo; campo.maxLength = 120;
  campo.setAttribute('aria-label', 'Nuevo nombre de la conversación');
  h2.replaceWith(campo);
  campo.focus(); campo.select();
  let terminado = false;
  const terminar = async (guardar) => {
    if (terminado) return;
    terminado = true;
    const nuevo = campo.value.trim();
    const restaurado = document.createElement('h2');
    restaurado.className = 'ai-titulo'; restaurado.id = 'aiTitulo'; restaurado.textContent = actual.titulo;
    campo.replaceWith(restaurado);
    if (guardar && nuevo && nuevo !== actual.titulo) {
      try {
        const c = await renombrarConversacion(actual.id, nuevo);
        actual.titulo = c.titulo;
        pintarCabecera();
        await cargarLista();
      } catch (err) { mostrarError(err.message); }
    }
  };
  campo.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); terminar(true); }
    if (e.key === 'Escape') { e.preventDefault(); terminar(false); }
  });
  campo.addEventListener('blur', () => terminar(true));
}

// ---------- Entrada de texto ----------

function ajustarAlto() {
  const input = $('aiInput');
  input.style.height = 'auto';
  input.style.height = `${Math.min(input.scrollHeight, 140)}px`;
  input.style.overflowY = input.scrollHeight > 140 ? 'auto' : 'hidden'; // sin barra de desplazamiento hasta que de verdad haga falta
}

function actualizarContador() {
  const largo = $('aiInput').value.length;
  const el = $('aiContador');
  el.textContent = `${largo} / ${MAX_PREGUNTA}`;
  el.classList.toggle('cerca-del-limite', largo > MAX_PREGUNTA * 0.9);
}

function cerrarListaMovil() {
  $('aiLista').classList.remove('abierta');
  $('aiToggleLista').setAttribute('aria-expanded', 'false');
}

// ---------- Eventos ----------

$('aiForm').addEventListener('submit', (e) => { e.preventDefault(); enviar($('aiInput').value.trim()); });
$('aiInput').addEventListener('input', () => { ajustarAlto(); actualizarContador(); });
$('aiInput').addEventListener('keydown', (e) => {
  // Enter envía; Shift+Enter agrega una línea (y no se envía mientras se compone con un teclado IME).
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('aiForm').requestSubmit(); }
});
$('aiNueva').addEventListener('click', nuevaConversacion);
$('aiRenombrar').addEventListener('click', iniciarRenombrado);
$('aiToggleLista').addEventListener('click', () => {
  const abierta = $('aiLista').classList.toggle('abierta');
  $('aiToggleLista').setAttribute('aria-expanded', String(abierta));
});

$('aiMensajes').addEventListener('click', async (e) => {
  const chip = e.target.closest('.ai-chip');
  if (chip) { enviar(chip.textContent); return; }
  const copiar = e.target.closest('[data-accion="copiar"]');
  if (copiar) {
    const burbujaEl = copiar.closest('.ai-msg');
    try {
      await navigator.clipboard.writeText(burbujaEl.querySelector('.md').innerText);
      copiar.textContent = '¡Copiado!';
      setTimeout(() => { copiar.textContent = 'Copiar'; }, 1500);
    } catch { copiar.textContent = 'No se pudo copiar'; }
  }
});

$('aiConversaciones').addEventListener('click', async (e) => {
  const fila = e.target.closest('.ai-conv');
  if (!fila) return;
  const id = Number(fila.dataset.id);
  if (e.target.closest('[data-accion="borrar"]')) {
    const c = conversaciones.find(x => x.id === id);
    if (!confirm(`¿Eliminar la conversación "${c?.titulo || ''}"? No se puede deshacer.`)) return;
    try {
      await eliminarConversacion(id);
      if (actual.id === id) nuevaConversacion();
      await cargarLista();
    } catch (err) { mostrarError(err.message); }
    return;
  }
  if (id !== actual.id) abrirConversacion(id);
  else cerrarListaMovil();
});

// ---------- Arranque ----------

(async function iniciar() {
  config = await cargarConfigEmpresa();
  renderSidebar(config, 'gealmi_ai');
  await renderTopbar(config);
  renderFooter();

  if (!buscarModulo(config, 'gealmi_ai') || !tienePermiso('gealmi_ai.ver')) {
    $('aiLayout').style.display = 'none';
    const aviso = $('aiNoDisponible');
    aviso.style.display = 'block';
    aviso.innerHTML = '<h3 style="margin:0 0 6px;">GEALMI AI no está disponible</h3><p style="margin:0; color:var(--muted); font-size:13px;">Tu empresa no lo tiene habilitado o tu rol no incluye este acceso. Pídele al administrador que lo active.</p>';
    return;
  }

  pintarTodo();
  actualizarContador();
  await cargarLista();
})();
</script>
</body>
</html>
