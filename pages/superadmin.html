<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEALMI — Super administrador</title>
<link rel="icon" href="../assets/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/panel-lateral.css">
<style>
  body{ background:var(--paper); }
  .sa-shell{ max-width:1040px; margin:0 auto; padding:28px 24px 20px; }
  .sa-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
  .sa-brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .sa-brand img{ width:34px; height:34px; }
  .sa-brand-text{ display:flex; align-items:center; gap:8px; font-family:'Inter', sans-serif; font-weight:800; font-size:16px; color:var(--ink); }
  .sa-brand-tag{ font-size:11px; font-weight:700; color:var(--teal-deep); background:var(--teal-soft); padding:3px 9px; border-radius:20px; }
  .sa-panel{ background:#fff; border-radius:14px; padding:24px; box-shadow:var(--card-shadow); margin-bottom:20px; }
  .sa-panel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .sa-panel-header h2{ font-family:'Inter', sans-serif; font-size:16px; font-weight:700; margin:0; color:var(--ink); }
  .sa-modulos-lista{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin:14px 0 0; }
  .sa-modulo-item{ display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--paper-line); border-radius:9px; font-size:13.5px; text-transform:none; letter-spacing:normal; color:var(--ink); font-weight:500; }
  .sa-modulo-item input{ width:auto; }
  .sa-estado-badge{ font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px; white-space:nowrap; }
  .sa-estado-badge.activo{ background:#E1F5EE; color:#0F6E56; }
  .sa-estado-badge.inactivo{ background:#FBEAF0; color:#993556; }
  .sa-acceso-denegado{ text-align:center; padding:80px 20px; color:var(--muted); }
  .sa-acceso-denegado h2{ font-family:'Inter', sans-serif; color:var(--ink); }
  .sa-subtitulo{ font-family:'Inter', sans-serif; font-size:13px; margin:20px 0 8px; color:var(--ink); font-weight:700; }
</style>
<!-- PWA instalable (Nivel 3 del roadmap) -- rutas absolutas, funcionan
     igual desde la raíz que desde pages/. sw.js se registra en js/sesion.js
     (importado por todas las páginas), no acá. -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0E1B45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GEALMI">
<link rel="apple-touch-icon" href="/assets/logo-icon.png">
</head>
<body>

<div class="sa-shell">
  <div class="sa-header">
    <a class="sa-brand" href="../" title="Ir a la página principal">
      <img src="../assets/logo-icon.png" alt="GEALMI">
      <div class="sa-brand-text">GEALMI <span class="sa-brand-tag">Super Admin</span></div>
    </a>
    <button type="button" class="btn btn-ghost" id="btnCerrarSesion" style="color:var(--ink); border:1px solid var(--paper-line);">Cerrar sesión</button>
  </div>

  <div id="contenido">Cargando…</div>

  <footer></footer>
</div>

<script type="module">
  import { haySesionActiva, obtenerSesion, cerrarSesion, esSuperAdmin, guardarSesion, respaldarSesionSuperAdmin } from '../js/sesion.js';
  import { API_BASE_URL } from '../js/apiConfig.js';
  import { abrirPanelLateral, cerrarPanelLateral } from '../components/panelLateral.js';
  import { renderFooter } from '../components/footer.js';
  import { escapeHtml } from '../js/utils.js';

  renderFooter();

  // Paquetes de módulos por perfil de negocio: activar uno de un clic en vez
  // de tildar checkbox por checkbox. Solo ACTIVAN (nunca desactivan) -- si
  // la empresa ya tenía otros módulos prendidos, se quedan como están.
  const PAQUETES = {
    taller: {
      icono: '🔧', label: 'Taller Mecánico',
      modulos: ['clientes', 'finanzas', 'vehiculos', 'repuestos', 'postventa', 'agenda']
    },
    concesionaria: {
      icono: '🚗', label: 'Concesionaria',
      modulos: ['clientes', 'finanzas', 'ventas', 'inventario', 'vehiculos', 'repuestos', 'postventa', 'agenda']
    },
    dental: {
      icono: '🦷', label: 'Clínica Dental',
      modulos: ['clientes', 'finanzas', 'tratamientos', 'planes_tratamiento', 'seguros_dentales', 'agenda']
    },
    optica: {
      icono: '👓', label: 'Óptica',
      modulos: ['clientes', 'finanzas', 'recetas_opticas', 'ordenes_laboratorio', 'seguros_vision', 'agenda']
    },
    veterinaria: {
      icono: '🐾', label: 'Veterinaria',
      modulos: ['clientes', 'finanzas', 'mascotas', 'atenciones_veterinarias', 'planes_veterinarios', 'seguros_mascotas', 'agenda']
    },
    transporte: {
      icono: '🚌', label: 'Transporte',
      // Sin 'clientes'/'agenda' a propósito -- este vertical no administra
      // pasajeros individuales, administra su propia flota (ver
      // 025_transporte.sql). El orden importa: respeta las dependencias
      // (flota/conductores/rutas antes que turnos/control_documentario).
      modulos: ['finanzas', 'flota', 'conductores', 'rutas', 'turnos', 'control_documentario']
    },
    polleria: {
      icono: '🍗', label: 'Pollería/Restaurante',
      // El orden importa: 'inventario' antes que 'combos'/'comandas' (ambos
      // dependen de él), y 'combos' antes que 'combo_ventas' (ver
      // 026_polleria.sql).
      modulos: ['inventario', 'finanzas', 'mesas', 'comandas', 'combos', 'combo_ventas']
    },
    gimnasio: {
      icono: '🏋️', label: 'Gimnasio',
      // El orden importa: 'clientes' y 'planes_membresia' antes que
      // 'membresias' (depende de ambos), y 'membresias' antes que
      // 'pagos_membresia' (ver 027_gimnasio.sql). Pagos manuales, sin
      // pasarela real -- decisión de alcance de esta primera versión.
      modulos: ['clientes', 'finanzas', 'planes_membresia', 'membresias', 'pagos_membresia']
    }
  };

  if (!haySesionActiva()) location.replace('login');

  const contenido = document.getElementById('contenido');
  document.getElementById('btnCerrarSesion').addEventListener('click', () => {
    cerrarSesion();
    location.replace('login');
  });

  if (!esSuperAdmin()) {
    contenido.innerHTML = `
      <div class="sa-acceso-denegado">
        <h2>Acceso restringido</h2>
        <p>Tu cuenta no tiene permisos de super administrador.</p>
      </div>`;
  } else {
    iniciar();
  }

  function headerAuth() {
    const token = obtenerSesion()?.token;
    return { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
  }

  // alert() a propósito: este panel no es de cara al cliente final, lo usa
  // un super admin -- no vale la pena construir un sistema de notificaciones
  // aparte para un puñado de acciones de back-office.
  async function api(path, opciones) {
    try {
      const res = await fetch(`${API_BASE_URL}${path}`, { headers: headerAuth(), ...opciones });
      if (!res.ok) {
        const cuerpo = await res.json().catch(() => ({}));
        throw new Error(cuerpo.error || `HTTP ${res.status}`);
      }
      if (res.status === 204) return true;
      return await res.json();
    } catch (err) {
      alert(err.message);
      return null;
    }
  }

  // Catálogo de planes (GET /superadmin/planes), cargado una sola vez: alimenta
  // la columna "Plan" de la tabla de empresas y el selector de gestionarEmpresa().
  let planes = [];
  const nombrePlan = (planId) => planes.find(p => p.id === planId)?.nombre;

  // Qué le da un plan a la empresa, en una línea -- se muestra ANTES de
  // guardar, para que cambiar de plan no sea a ciegas. "Sin plan" (plan_id
  // NULL) no es lo mismo que Básico: no limita usuarios, pero tampoco da
  // acceso a la API pública ni al 2FA.
  function describirPlan(planId, empresa) {
    const plan = planes.find(p => String(p.id) === String(planId));
    const actual = planes.find(p => p.id === empresa.plan_id);
    const resumen = `${plan ? plan.nombre : 'Sin plan'}: ` + [
      !plan || plan.limite_usuarios == null ? 'usuarios sin límite' : `hasta ${plan.limite_usuarios} usuarios`,
      plan?.acceso_api ? 'API pública' : 'sin API pública',
      plan?.acceso_2fa ? 'verificación en dos pasos' : 'sin verificación en dos pasos'
    ].join(' · ');

    const avisos = [];
    if (plan && plan.limite_usuarios != null && Number(empresa.usuarios_count) > plan.limite_usuarios) {
      avisos.push(`Esta empresa ya tiene ${empresa.usuarios_count} usuarios, más que el límite: no podrá agregar más hasta bajar de ${plan.limite_usuarios}.`);
    }
    if (actual?.acceso_api && !plan?.acceso_api) avisos.push('Sus API keys actuales dejarán de funcionar.');
    if (actual?.acceso_2fa && !plan?.acceso_2fa) avisos.push('Quienes ya tengan 2FA activo lo conservan; nadie más podrá activarlo.');
    return { resumen, avisos };
  }

  async function iniciar() {
    contenido.innerHTML = `
      <div class="sa-panel">
        <div class="sa-panel-header">
          <h2>Empresas</h2>
          <button type="button" class="btn btn-ochre" id="btnNuevaEmpresa">+ Nueva empresa</button>
        </div>
        <div id="formNuevaEmpresaWrap"></div>
        <div id="tablaEmpresas">Cargando…</div>
      </div>
      <div class="sa-panel">
        <div class="sa-panel-header">
          <h2>Catálogo de módulos</h2>
          <button type="button" class="btn btn-ochre" id="btnNuevoModulo">+ Nuevo módulo</button>
        </div>
        <p style="font-size:12.5px; color:var(--muted); margin:2px 0 0;">
          Esto solo da de alta el módulo en el catálogo (aparece como opción para habilitarlo por empresa).
          Si el módulo necesita guardar datos propios, la tabla y las rutas del backend siguen siendo trabajo de código aparte.
        </p>
        <div id="formNuevoModuloWrap"></div>
        <div id="tablaModulos">Cargando…</div>
      </div>
    `;
    document.getElementById('btnNuevaEmpresa').addEventListener('click', toggleFormNuevaEmpresa);
    document.getElementById('btnNuevoModulo').addEventListener('click', () => toggleFormModulo());
    await cargarEmpresas();
    await cargarModulos();
  }

  async function cargarModulos() {
    const cont = document.getElementById('tablaModulos');
    const modulos = await api('/superadmin/modulos');
    if (!modulos) { cont.innerHTML = '<p class="tabla-vacia">No se pudo conectar con el backend.</p>'; return; }

    cont.innerHTML = `
      <div class="tabla-registros-wrap">
        <table class="tabla-registros">
          <thead><tr><th>Módulo</th><th>id</th><th>Página</th><th>Datos propios</th><th>Depende de</th><th class="col-acciones"></th></tr></thead>
          <tbody>
            ${modulos.map(m => `
              <tr data-id="${m.id}">
                <td>${m.icon || ''} ${escapeHtml(m.label)}</td>
                <td><code>${escapeHtml(m.id)}</code></td>
                <td>${escapeHtml(m.page)}</td>
                <td>${m.base_de_datos ? 'Sí' : 'No'}</td>
                <td>${(m.dependencias || []).length ? escapeHtml(m.dependencias.join(', ')) : '—'}</td>
                <td class="col-acciones">
                  <button type="button" class="icon-btn" data-accion="editar-modulo" title="Editar">✏️</button>
                  <button type="button" class="icon-btn" data-accion="borrar-modulo" title="Borrar del catálogo">🗑️</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
    cont.querySelectorAll('[data-accion="editar-modulo"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.closest('tr').dataset.id;
        toggleFormModulo(modulos.find(m => m.id === id));
      });
    });
    cont.querySelectorAll('[data-accion="borrar-modulo"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.closest('tr').dataset.id;
        if (!confirm(`¿Borrar "${id}" del catálogo? Solo se puede si ninguna empresa lo tiene activo y ningún otro módulo depende de él.`)) return;
        const res = await api(`/superadmin/modulos/${id}`, { method: 'DELETE' });
        if (res !== null) await cargarModulos();
      });
    });

    return modulos;
  }

  // moduloExistente presente = editar (id fijo, no se puede tocar);
  // ausente = alta nueva. Mismo formulario para los dos casos.
  function toggleFormModulo(moduloExistente) {
    const wrap = document.getElementById('formNuevoModuloWrap');
    if (wrap.innerHTML) { wrap.innerHTML = ''; return; }
    const editando = !!moduloExistente;
    const m = moduloExistente || { id: '', label: '', icon: '', page: '', base_de_datos: false, dependencias: [] };

    wrap.innerHTML = `
      <form class="form-registro" id="formModulo" style="margin:16px 0 20px; padding-bottom:20px; border-bottom:1px solid var(--paper-line);">
        <div class="campo">
          <label>id (minúsculas, sin espacios, ej. "mascotas")</label>
          <input type="text" id="moduloId" value="${escapeHtml(m.id)}" ${editando ? 'disabled' : 'required pattern="[a-z][a-z0-9_]{1,39}"'}>
        </div>
        <div class="campo"><label>Nombre visible</label><input type="text" id="moduloLabel" value="${escapeHtml(m.label)}" required></div>
        <div class="campo"><label>Ícono (un emoji, opcional)</label><input type="text" id="moduloIcon" value="${escapeHtml(m.icon || '')}" maxlength="4"></div>
        <div class="campo"><label>Página (ej. "mascotas.html")</label><input type="text" id="moduloPage" value="${escapeHtml(m.page)}" required></div>
        <div class="campo">
          <label class="sa-modulo-item"><input type="checkbox" id="moduloBaseDeDatos" ${m.base_de_datos ? 'checked' : ''}> Guarda datos propios (tiene tabla y rutas de backend)</label>
        </div>
        <div class="campo">
          <label>Depende de (mantén Ctrl/Cmd para elegir varios; opcional)</label>
          <select id="moduloDependencias" multiple size="5"></select>
        </div>
        <div class="campo campo-accion">
          <button type="submit" class="btn btn-ochre">${editando ? 'Guardar cambios' : 'Crear módulo'}</button>
          <span class="form-status" id="moduloStatus"></span>
        </div>
      </form>
    `;

    // El <select> de dependencias se llena con el resto del catálogo (nunca
    // consigo mismo, ver la validación de "no puede depender de sí mismo"
    // en el backend).
    api('/superadmin/modulos').then(catalogo => {
      const select = document.getElementById('moduloDependencias');
      if (!catalogo) return;
      catalogo.filter(c => c.id !== m.id).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = `${c.icon || ''} ${c.label} (${c.id})`;
        if ((m.dependencias || []).includes(c.id)) opt.selected = true;
        select.appendChild(opt);
      });
    });

    document.getElementById('formModulo').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('moduloStatus');
      const dependencias = Array.from(document.getElementById('moduloDependencias').selectedOptions).map(o => o.value);
      const payload = {
        label: document.getElementById('moduloLabel').value.trim(),
        icon: document.getElementById('moduloIcon').value.trim(),
        page: document.getElementById('moduloPage').value.trim(),
        base_de_datos: document.getElementById('moduloBaseDeDatos').checked,
        dependencias
      };
      const res = editando
        ? await api(`/superadmin/modulos/${m.id}`, { method: 'PUT', body: JSON.stringify(payload) })
        : await api('/superadmin/modulos', { method: 'POST', body: JSON.stringify({ id: document.getElementById('moduloId').value.trim(), ...payload }) });
      if (res) {
        wrap.innerHTML = '';
        await cargarModulos();
      } else {
        statusEl.textContent = 'No se pudo guardar.';
        statusEl.style.color = 'var(--coral)';
      }
    });
  }

  function toggleFormNuevaEmpresa() {
    const wrap = document.getElementById('formNuevaEmpresaWrap');
    if (wrap.innerHTML) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = `
      <form class="form-registro" id="formNuevaEmpresa" style="margin:16px 0 20px; padding-bottom:20px; border-bottom:1px solid var(--paper-line);">
        <div class="campo"><label>Nombre</label><input type="text" id="nuevaEmpresaNombre" required></div>
        <div class="campo"><label>Logo (iniciales)</label><input type="text" id="nuevaEmpresaLogo" maxlength="4" placeholder="Opcional"></div>
        <div class="campo campo-accion">
          <button type="submit" class="btn btn-ochre">Crear empresa</button>
          <span class="form-status" id="nuevaEmpresaStatus"></span>
        </div>
      </form>
    `;
    document.getElementById('formNuevaEmpresa').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nuevaEmpresaNombre').value.trim();
      const logo = document.getElementById('nuevaEmpresaLogo').value.trim();
      const res = await api('/superadmin/empresas', { method: 'POST', body: JSON.stringify({ nombre, logo: logo || undefined }) });
      if (res) { wrap.innerHTML = ''; await cargarEmpresas(); }
    });
  }

  async function cargarEmpresas() {
    const cont = document.getElementById('tablaEmpresas');
    const empresas = await api('/superadmin/empresas');
    if (!empresas) { cont.innerHTML = '<p class="tabla-vacia">No se pudo conectar con el backend.</p>'; return; }
    if (!empresas.length) { cont.innerHTML = '<p class="tabla-vacia">Todavía no hay empresas. Usa "+ Nueva empresa" para crear la primera.</p>'; return; }
    if (!planes.length) planes = (await api('/superadmin/planes')) || [];

    cont.innerHTML = `
      <div class="tabla-registros-wrap">
        <table class="tabla-registros">
          <thead><tr><th>Nombre</th><th>Usuarios</th><th>Módulos</th><th>Plan</th><th>Estado</th><th class="col-acciones"></th></tr></thead>
          <tbody>
            ${empresas.map(e => `
              <tr data-id="${e.id}">
                <td>${escapeHtml(e.nombre)}</td>
                <td>${e.usuarios_count}</td>
                <td>${e.modulos_count}</td>
                <td>${e.plan_id ? escapeHtml(nombrePlan(e.plan_id) || `#${e.plan_id}`) : '<span style="color:var(--muted);">Sin plan</span>'}</td>
                <td><span class="sa-estado-badge ${e.activo ? 'activo' : 'inactivo'}">${e.activo ? 'Activa' : 'Inactiva'}</span></td>
                <td class="col-acciones"><button type="button" class="icon-btn" data-accion="gestionar" title="Gestionar">⚙️</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
    cont.querySelectorAll('[data-accion="gestionar"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.closest('tr').dataset.id;
        const empresa = empresas.find(e => String(e.id) === id);
        gestionarEmpresa(empresa);
      });
    });
  }

  function gestionarEmpresa(empresa) {
    abrirPanelLateral({
      titulo: `Gestionar: ${empresa.nombre}`,
      icono: '🏢',
      ancho: 'amplio',
      montar: async (body) => {
        body.innerHTML = 'Cargando módulos…';
        const modulos = await api(`/superadmin/empresas/${empresa.id}/modulos`);
        if (!modulos) { body.innerHTML = 'No se pudieron cargar los módulos.'; return; }
        // Sin el catálogo, el selector no tendría de dónde armar las opciones y
        // mostraría "Sin plan asignado" aunque la empresa tenga uno: guardar
        // así le QUITARÍA el plan. Por eso, sin catálogo, se deshabilita.
        if (!planes.length) planes = (await api('/superadmin/planes')) || [];
        const planesCargados = planes.length > 0;

        body.innerHTML = `
          <div class="sa-subtitulo">Nombre</div>
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
            <input type="text" id="empresaNombre" value="${escapeHtml(empresa.nombre)}" style="flex:1; font-family:'Inter',sans-serif; font-size:13px; padding:9px 11px; border:1px solid var(--paper-line); border-radius:8px; background:#fff; color:var(--ink);">
            <button type="button" class="btn btn-ochre" id="btnGuardarNombre">Guardar</button>
          </div>
          <div class="form-status" id="nombreStatus" style="margin:-14px 0 20px;"></div>

          <div class="sa-subtitulo">Estado</div>
          <label class="sa-modulo-item" style="margin-bottom:6px;">
            <input type="checkbox" id="empresaActiva" ${empresa.activo ? 'checked' : ''}>
            Empresa activa (si se desmarca, nadie de esta empresa puede iniciar sesión)
          </label>
          <div class="form-status" id="activoStatus" style="margin-bottom:20px;"></div>

          <div class="sa-subtitulo">Plan</div>
          <div style="display:flex; align-items:center; gap:10px;">
            <select id="empresaPlan" ${planesCargados ? '' : 'disabled'} style="flex:1; font-family:'Inter',sans-serif; font-size:13px; padding:9px 11px; border:1px solid var(--paper-line); border-radius:8px; background:#fff; color:var(--ink);">
              <option value="">Sin plan asignado</option>
              ${planes.map(p => `<option value="${p.id}" ${empresa.plan_id === p.id ? 'selected' : ''}>${escapeHtml(p.nombre)}</option>`).join('')}
              ${empresa.plan_id && !nombrePlan(empresa.plan_id) ? `<option value="${empresa.plan_id}" selected>Plan #${empresa.plan_id} (fuera del catálogo)</option>` : ''}
            </select>
            <button type="button" class="btn btn-ochre" id="btnGuardarPlan" ${planesCargados ? '' : 'disabled'}>Guardar</button>
          </div>
          <div id="planDetalle" style="font-size:12px; color:var(--muted); line-height:1.55; margin-top:8px;"></div>
          <div class="form-status" id="planStatus" style="margin-bottom:20px;"></div>

          <div class="sa-subtitulo">Soporte</div>
          <div style="margin-bottom:20px;">
            <textarea id="impersonarMotivo" rows="2" placeholder="Motivo (obligatorio, ej. &quot;Cliente reporta error al guardar una venta&quot;)"
              style="width:100%; font-family:'Inter',sans-serif; font-size:13px; padding:9px 11px; border:1px solid var(--paper-line); border-radius:8px; background:#fff; color:var(--ink); resize:vertical; box-sizing:border-box;"></textarea>
            <div style="display:flex; align-items:center; gap:10px; margin-top:8px;">
              <button type="button" class="btn btn-ghost" id="btnImpersonar" style="border:1px solid var(--paper-line);">🔒 Entrar como soporte técnico</button>
              <span class="form-status" id="impersonarStatus"></span>
            </div>
            <div style="font-size:11.5px; color:var(--muted); margin-top:6px;">Queda registrado en la Auditoría de esta empresa: quién, cuándo y por qué. Sesión de 30 minutos.</div>
          </div>

          <div class="sa-subtitulo">Color de marca</div>
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
            <input type="color" id="colorPrimario" value="${empresa.color_primario || '#E3B23C'}" style="width:44px; height:34px; padding:2px; border:1px solid var(--paper-line); border-radius:8px; cursor:pointer;">
            <button type="button" class="btn btn-ghost" id="btnQuitarColor" style="${empresa.color_primario ? '' : 'display:none;'}">Usar el de GEALMI</button>
            <span class="form-status" id="colorStatus"></span>
          </div>

          <div class="sa-subtitulo">Módulos habilitados</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
            ${Object.entries(PAQUETES).map(([id, p]) => `
              <button type="button" class="btn btn-ghost" data-paquete="${id}" style="padding:6px 12px; font-size:12px;" title="Activa de una sola vez los módulos de este paquete (no desactiva nada que ya esté prendido)">
                ${p.icono} ${p.label}
              </button>`).join('')}
          </div>
          <div class="sa-modulos-lista" id="listaModulos">
            ${modulos.map(m => `
              <label class="sa-modulo-item">
                <input type="checkbox" data-modulo="${m.id}" ${m.habilitado ? 'checked' : ''}>
                ${m.icon || ''} ${m.label}
              </label>`).join('')}
          </div>

          <div class="sa-subtitulo" style="margin-top:26px;">Agregar administrador</div>
          <form class="form-registro" id="formAdmin" style="grid-template-columns:1fr;">
            <div class="campo"><label>Nombre</label><input type="text" id="adminNombre" required></div>
            <div class="campo"><label>Correo</label><input type="email" id="adminEmail" required></div>
            <div class="campo"><label>Contraseña (solo si es cuenta nueva)</label><input type="password" id="adminPassword" placeholder="Mínimo 6 caracteres"></div>
            <div class="campo campo-accion">
              <button type="submit" class="btn btn-ochre" style="width:100%; justify-content:center;">Agregar administrador</button>
              <span class="form-status" id="adminStatus"></span>
            </div>
          </form>

          <div class="sa-subtitulo" style="margin-top:26px; color:var(--coral);">Zona de peligro</div>
          <div style="border:1.5px solid var(--coral); border-radius:10px; padding:14px 16px; margin-top:6px;">
            <p style="font-size:12.5px; color:var(--muted); margin:0 0 10px; line-height:1.5;">
              Borra la empresa y TODOS sus datos de forma permanente: ${empresa.usuarios_count} usuario(s), ${empresa.modulos_count} módulo(s) activo(s), y cada venta/cliente/registro de cada módulo que haya usado. No se puede deshacer -- a diferencia de desactivar, esto no se reactiva.
            </p>
            <label style="font-size:12px; font-weight:600; color:var(--ink); display:block; margin-bottom:6px;">
              Escribe "${escapeHtml(empresa.nombre)}" para confirmar
            </label>
            <input type="text" id="confirmarBorrado" placeholder="${escapeHtml(empresa.nombre)}" autocomplete="off"
              style="width:100%; font-family:'Inter',sans-serif; font-size:13px; padding:9px 11px; border:1px solid var(--paper-line); border-radius:8px; background:#fff; color:var(--ink); box-sizing:border-box; margin-bottom:10px;">
            <div style="display:flex; align-items:center; gap:10px;">
              <button type="button" class="btn" id="btnBorrarEmpresa" disabled
                style="background:var(--coral); color:#fff; border:none;">🗑️ Borrar empresa permanentemente</button>
              <span class="form-status" id="borrarStatus"></span>
            </div>
          </div>
        `;

        document.getElementById('btnGuardarNombre').addEventListener('click', async () => {
          const statusEl = document.getElementById('nombreStatus');
          const nuevoNombre = document.getElementById('empresaNombre').value.trim();
          if (!nuevoNombre) {
            statusEl.textContent = 'El nombre no puede estar vacío.';
            statusEl.style.color = 'var(--coral)';
            return;
          }
          const res = await api(`/superadmin/empresas/${empresa.id}`, {
            method: 'PUT', body: JSON.stringify({ nombre: nuevoNombre })
          });
          if (res) {
            empresa.nombre = nuevoNombre;
            document.getElementById('panelLateralTitulo').textContent = `Gestionar: ${nuevoNombre}`;
            statusEl.textContent = 'Guardado.';
            statusEl.style.color = 'var(--teal-strong)';
            await cargarEmpresas();
          } else {
            statusEl.textContent = 'No se pudo guardar.';
            statusEl.style.color = 'var(--coral)';
          }
        });

        document.getElementById('empresaActiva').addEventListener('change', async (e) => {
          const activo = e.target.checked;
          const statusEl = document.getElementById('activoStatus');
          // Solo se confirma al DESACTIVAR (la dirección riesgosa) -- reactivar
          // es una acción de recuperación, no hace falta frenarla igual.
          if (!activo && !confirm(`¿Desactivar "${empresa.nombre}"? Nadie de esa empresa va a poder iniciar sesión hasta que la reactives.`)) {
            e.target.checked = true;
            return;
          }
          e.target.disabled = true;
          statusEl.textContent = 'Guardando...';
          statusEl.style.color = 'var(--muted)';
          const res = await api(`/superadmin/empresas/${empresa.id}`, {
            method: 'PUT', body: JSON.stringify({ activo })
          });
          e.target.disabled = false;
          if (res) {
            empresa.activo = activo;
            statusEl.textContent = activo ? 'Guardado: empresa activa.' : 'Guardado: empresa desactivada.';
            statusEl.style.color = 'var(--teal-strong)';
            await cargarEmpresas(); // refresca el badge de estado en la tabla de fondo
          } else {
            e.target.checked = !activo; // revertir si falló
            statusEl.textContent = 'No se pudo guardar el cambio.';
            statusEl.style.color = 'var(--coral)';
          }
        });

        // Plan: el resumen de lo que incluye se muestra al ELEGIR (antes de
        // guardar); el cambio real ocurre con el botón, igual que el nombre.
        const selectPlan = document.getElementById('empresaPlan');
        function pintarDetallePlan() {
          if (!planesCargados) {
            document.getElementById('planDetalle').textContent = 'No se pudo cargar el catálogo de planes. Recarga la página para cambiar el plan.';
            return;
          }
          const { resumen, avisos } = describirPlan(selectPlan.value, empresa);
          document.getElementById('planDetalle').innerHTML =
            escapeHtml(resumen) + avisos.map(a => `<div style="color:#8A5A00;">⚠ ${escapeHtml(a)}</div>`).join('');
        }
        pintarDetallePlan();
        selectPlan.addEventListener('change', () => {
          pintarDetallePlan();
          document.getElementById('planStatus').textContent = '';
        });
        document.getElementById('btnGuardarPlan').addEventListener('click', async () => {
          const statusEl = document.getElementById('planStatus');
          const btn = document.getElementById('btnGuardarPlan');
          btn.disabled = true;
          const res = await api(`/superadmin/empresas/${empresa.id}`, {
            method: 'PUT', body: JSON.stringify({ plan_id: selectPlan.value ? Number(selectPlan.value) : null })
          });
          btn.disabled = false;
          if (!res) {
            statusEl.textContent = 'No se pudo guardar.';
            statusEl.style.color = 'var(--coral)';
            return;
          }
          empresa.plan_id = res.plan_id ?? null;
          statusEl.textContent = 'Plan guardado.';
          statusEl.style.color = 'var(--teal-strong)';
          pintarDetallePlan();
          await cargarEmpresas(); // refresca la columna "Plan" de la tabla de fondo
        });

        document.getElementById('btnImpersonar').addEventListener('click', async () => {
          const statusEl = document.getElementById('impersonarStatus');
          const motivo = document.getElementById('impersonarMotivo').value.trim();
          if (!motivo) {
            statusEl.textContent = 'Escribe un motivo antes de entrar.';
            statusEl.style.color = 'var(--coral)';
            return;
          }
          if (!confirm(`¿Entrar a "${empresa.nombre}" como soporte técnico? Va a quedar registrado en su Auditoría.`)) return;
          const res = await api(`/superadmin/empresas/${empresa.id}/impersonar`, { method: 'POST', body: JSON.stringify({ motivo }) });
          if (res) {
            respaldarSesionSuperAdmin();
            guardarSesion(res);
            location.href = '../';
          } else {
            statusEl.textContent = 'No se pudo entrar.';
            statusEl.style.color = 'var(--coral)';
          }
        });

        document.getElementById('colorPrimario').addEventListener('change', async (e) => {
          const statusEl = document.getElementById('colorStatus');
          const res = await api(`/superadmin/empresas/${empresa.id}`, {
            method: 'PUT', body: JSON.stringify({ color_primario: e.target.value })
          });
          if (res) {
            empresa.color_primario = e.target.value;
            statusEl.textContent = 'Guardado.';
            statusEl.style.color = 'var(--teal-strong)';
            document.getElementById('btnQuitarColor').style.display = '';
            await cargarEmpresas();
          }
        });

        document.getElementById('btnQuitarColor').addEventListener('click', async () => {
          const res = await api(`/superadmin/empresas/${empresa.id}`, {
            method: 'PUT', body: JSON.stringify({ color_primario: null })
          });
          if (res) {
            empresa.color_primario = null;
            document.getElementById('colorPrimario').value = '#E3B23C';
            document.getElementById('btnQuitarColor').style.display = 'none';
            document.getElementById('colorStatus').textContent = '';
            await cargarEmpresas();
          }
        });

        // Función compartida por el checkbox individual y por los paquetes
        // de abajo -- centralizada a propósito: desde que activar/desactivar
        // valida dependencias del lado del servidor (ver
        // 023_dependencias_modulos.sql), el ORDEN y que cada llamada espere
        // a la anterior importa. Antes cada checkbox disparaba su propio
        // 'change' sin esperar (fire-and-forget) -- con dependencias reales
        // eso es una condición de carrera: la petición de "postventa" podía
        // llegar al backend antes de que "vehiculos" terminara de guardarse,
        // y el backend la rechazaba (400, dependencia faltante) aunque el
        // checkbox correcto ya estuviera tildado en pantalla.
        async function activarModulo(chk) {
          const moduloId = chk.dataset.modulo;
          const habilitar = chk.checked;
          chk.disabled = true;
          const res = habilitar
            ? await api(`/superadmin/empresas/${empresa.id}/modulos`, { method: 'POST', body: JSON.stringify({ modulo_id: moduloId }) })
            : await api(`/superadmin/empresas/${empresa.id}/modulos/${moduloId}`, { method: 'DELETE' });
          chk.disabled = false;
          if (res === null) chk.checked = !habilitar; // revertir si falló
          await cargarEmpresas(); // refresca el conteo de módulos en la tabla de fondo
          return res !== null;
        }

        document.getElementById('listaModulos').querySelectorAll('input[type="checkbox"]').forEach(chk => {
          chk.addEventListener('change', () => activarModulo(chk));
        });

        // Un paquete = tildar, EN ORDEN Y UNO A LA VEZ (await secuencial),
        // cada checkbox del paquete que todavía no estaba activo -- no se
        // toca ninguno que ya estuviera prendido ni ninguno fuera del
        // paquete. El orden en que cada PAQUETES.*.modulos lista sus ids
        // importa: debe respetar las dependencias (ej. "clientes" antes que
        // "mascotas", "vehiculos" antes que "postventa").
        body.querySelectorAll('[data-paquete]').forEach(btn => {
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            const paquete = PAQUETES[btn.dataset.paquete];
            for (const moduloId of paquete.modulos) {
              const chk = body.querySelector(`[data-modulo="${moduloId}"]`);
              if (chk && !chk.checked) {
                chk.checked = true;
                const ok = await activarModulo(chk);
                if (!ok) break; // se detiene si algo falla, para no seguir activando fuera de orden
              }
            }
            btn.disabled = false;
          });
        });

        document.getElementById('formAdmin').addEventListener('submit', async (e) => {
          e.preventDefault();
          const nombre = document.getElementById('adminNombre').value.trim();
          const email = document.getElementById('adminEmail').value.trim();
          const password = document.getElementById('adminPassword').value;
          const statusEl = document.getElementById('adminStatus');
          const res = await api(`/superadmin/empresas/${empresa.id}/admin`, {
            method: 'POST', body: JSON.stringify({ nombre, email, password: password || undefined })
          });
          if (res) {
            statusEl.textContent = 'Administrador agregado.';
            statusEl.style.color = 'var(--teal-strong)';
            document.getElementById('formAdmin').reset();
            await cargarEmpresas();
          }
        });

        // El botón queda deshabilitado hasta que el nombre escrito coincide
        // letra por letra -- es la primera barrera, antes incluso de llegar
        // al confirm() de abajo. El backend igual vuelve a validar esto
        // mismo (ver DELETE /superadmin/empresas/:id): esta comprobación acá
        // es para que el usuario no llegue a intentarlo con el nombre mal
        // escrito, no un reemplazo de la validación real.
        const inputConfirmar = document.getElementById('confirmarBorrado');
        const btnBorrar = document.getElementById('btnBorrarEmpresa');
        inputConfirmar.addEventListener('input', () => {
          btnBorrar.disabled = inputConfirmar.value.trim() !== empresa.nombre;
        });
        btnBorrar.addEventListener('click', async () => {
          if (!confirm(`Última confirmación: esto borra "${empresa.nombre}" y TODOS sus datos para siempre, sin forma de deshacerlo. ¿Continuar?`)) return;
          const statusEl = document.getElementById('borrarStatus');
          btnBorrar.disabled = true;
          statusEl.textContent = 'Borrando...';
          statusEl.style.color = 'var(--muted)';
          const res = await api(`/superadmin/empresas/${empresa.id}`, {
            method: 'DELETE', body: JSON.stringify({ confirmarNombre: inputConfirmar.value.trim() })
          });
          if (res !== null) {
            cerrarPanelLateral();
            await cargarEmpresas();
          } else {
            btnBorrar.disabled = false;
            statusEl.textContent = '';
          }
        });
      }
    });
  }
</script>
</body>
</html>
