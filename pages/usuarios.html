<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEALMI — Usuarios</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/panel-lateral.css">
<!-- Chart.js local (mismo que el resto de las páginas con gráficos) -- faltaba
     acá aunque el script de abajo importa js/charts.js y dibuja 4 gráficos.
     Sin esto, dibujarChartPermisos() explotaba con "Chart is not defined" y
     cortaba iniciar() ANTES de cargarTabla(), dejando la tabla de usuarios
     colgada en "Cargando…" para siempre. -->
<script src="../lib/chart.js"></script>
<!-- PWA instalable (Nivel 3 del roadmap) -- rutas absolutas, funcionan
     igual desde la raíz que desde pages/. sw.js se registra en js/sesion.js
     (importado por todas las páginas), no acá. -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0E1B45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GEALMI">
<link rel="apple-touch-icon" href="/assets/logo-icon.png">
</head>
<body data-modulo="usuarios">

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="topbarTitle">Usuarios</h1>
        <div class="topbar-subtitle" id="topbarSubtitle">QUIÉN PUEDE ENTRAR Y QUÉ PUEDE HACER</div>
      </div>
      <div class="topbar-search" id="topbarSearch"></div>
      <div id="sesionWidget" class="sesion-widget"></div>
    </header>

    <main>
      <div class="kpis" id="usrKpis"></div>

      <div class="inicio-columnas">
        <div class="inicio-col">
          <section class="panel captura-panel" id="capturaSection">
            <div class="captura-header">
              <h3>Cuentas</h3>
              <div class="captura-header-acciones">
                <button type="button" class="btn btn-ochre" id="btnNuevoUsuario" style="display:none;">+ Nuevo usuario</button>
              </div>
            </div>
            <span id="formStatus" class="form-status"></span>
            <div id="tablaUsuarios">Cargando…</div>
          </section>
        </div>
        <div class="inicio-col inicio-col-angosta">
          <div class="panel" style="padding:20px;">
            <h3 style="margin-bottom:4px;">Roles y permisos</h3>
            <div style="font-size:12px; color:var(--muted); margin-bottom:14px;">Clic en un rol para ver qué puede hacer.</div>
            <div id="rolesLista"></div>
          </div>
        </div>
      </div>

      <div class="secundarios-grid">
        <div class="sec-chart-panel">
          <h4>Usuarios por rol <span class="tag">Distribución</span></h4>
          <div class="chart-wrap" id="usrChartRolWrap"><canvas id="usrChartRol"></canvas></div>
        </div>
        <div class="sec-chart-panel">
          <h4>Activos vs. inactivos <span class="tag">Proporción</span></h4>
          <div class="chart-wrap" id="usrChartEstadoWrap"><canvas id="usrChartEstado"></canvas></div>
        </div>
        <div class="sec-chart-panel">
          <h4>Usuarios nuevos <span class="tag">Últimos 6 meses</span></h4>
          <div class="chart-wrap" id="usrChartNuevosWrap"><canvas id="usrChartNuevos"></canvas></div>
        </div>
        <div class="sec-chart-panel">
          <h4>Permisos por módulo <span class="tag">Todos los roles</span></h4>
          <div class="chart-wrap" id="usrChartPermisosWrap"><canvas id="usrChartPermisos"></canvas></div>
        </div>
      </div>
    </main>

    <footer></footer>
  </div>
</div>

<script type="module">
import { cargarConfigEmpresa } from '../js/config.js';
import { renderSidebar } from '../components/sidebar.js';
import { renderGealmiAiWidget } from '../components/gealmiAiWidget.js';
import { renderTopbar } from '../components/topbar.js';
import { renderFooter } from '../components/footer.js';
import { obtenerSesion, tienePermiso, haySesionActiva } from '../js/sesion.js';
import { listarRegistros, crearRegistro, actualizarRegistro, eliminarRegistro, ultimoErrorAPI } from '../js/api.js';
import { abrirPanelLateral, cerrarPanelLateral } from '../components/panelLateral.js';
import { renderFormulario } from '../components/formularioRegistro.js';
import { escapeHtml, fmtNum } from '../js/utils.js';
import { kpiCard } from '../js/kpiCard.js';
import { crearGraficoDona, crearGraficoBarras } from '../js/charts.js';

if (!haySesionActiva()) location.replace('login.html');

let config;
let roles = [];
let sucursales = []; // Sub-fase F: para el select "Sucursal" del panel de editar
let chartRol = null;
let chartEstado = null;
let chartNuevos = null;
let chartPermisos = null;

function ultimosNMeses(n) {
  const hoy = new Date();
  const meses = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    meses.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  }
  return meses;
}
function etiquetaMes(mesStr) {
  const [y, mm] = mesStr.split('-');
  return new Date(Number(y), Number(mm) - 1, 1).toLocaleDateString('es-PE', { month: 'short', year: '2-digit' });
}

async function pedirRoles() {
  const sesion = obtenerSesion();
  try {
    const res = await fetch(`${config.apiBaseUrl}/usuarios/roles`, { headers: { Authorization: `Bearer ${sesion.token}` } });
    if (!res.ok) return [];
    return await res.json();
  } catch { return []; }
}

// Sub-fase F: lista de sucursales para el select "Sucursal" del panel de
// editar usuario. Si quien está logueado no tiene sucursales.ver (rol sin
// ese permiso, ver migración 037), listarRegistros() simplemente devuelve
// null -- se cae a lista vacía y el select queda solo con "Todas", sin romper nada.
async function pedirSucursales() {
  return (await listarRegistros(config.apiBaseUrl, 'sucursales')) || [];
}

function badgeRol(rol) {
  return `<span class="role-badge role-categoria">${rol}</span>`;
}
function badgeEstado(activo) {
  return activo
    ? `<span class="role-badge role-numerico">Activo</span>`
    : `<span class="role-badge role-fecha">Inactivo</span>`;
}

// "Último acceso" no se muestra a propósito: no existe ningún dato real
// detrás -- usuarios no tiene columna de último login, y auth.js no
// registra el login en audit_log (solo se auditan creaciones/ediciones/
// borrados de registros, no inicios de sesión). Mostrarlo sería inventar
// un dato, así que se deja fuera hasta que exista de verdad.
function dibujarKpis(usuarios) {
  const activos = usuarios.filter(u => u.activo).length;
  const admins = usuarios.filter(u => u.rol === 'administrador').length;
  const rolesEnUso = new Set(usuarios.map(u => u.rol)).size;

  document.getElementById('usrKpis').innerHTML = [
    kpiCard({ acento: 'blue', icono: '👥', label: 'Usuarios', value: fmtNum(usuarios.length), sub: `${rolesEnUso} rol(es) en uso` }),
    kpiCard({ acento: 'teal', icono: '🟢', label: 'Activos', value: fmtNum(activos), sub: `${usuarios.length - activos} inactivo(s)` }),
    kpiCard({ acento: 'purple', icono: '🛡️', label: 'Administradores', value: fmtNum(admins), sub: 'con acceso total' }),
    kpiCard({ acento: 'orange', icono: '🔐', label: 'Roles configurados', value: fmtNum(roles.length), sub: 'ver detalle a la derecha' })
  ].join('');
}

async function cargarTabla() {
  const cont = document.getElementById('tablaUsuarios');
  const usuarios = await listarRegistros(config.apiBaseUrl, 'usuarios');
  if (!usuarios) { cont.innerHTML = '<p class="tabla-vacia">No se pudo conectar con el backend.</p>'; return; }
  dibujarKpis(usuarios);
  dibujarChartsUsuarios(usuarios);
  if (!usuarios.length) { cont.innerHTML = '<p class="tabla-vacia">No hay usuarios registrados todavía.</p>'; return; }

  const puedeEditar = tienePermiso('usuarios.editar');
  const puedeEliminar = tienePermiso('usuarios.eliminar');
  const puedeVerActividad = tienePermiso('auditoria.ver');
  const puedeAlgo = puedeEditar || puedeEliminar || puedeVerActividad;
  const miId = obtenerSesion()?.usuario?.id;

  cont.innerHTML = `
    <div class="tabla-registros-wrap" style="margin-top:14px;">
      <table class="tabla-registros">
        <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Sucursal</th><th>Estado</th>${puedeAlgo ? '<th class="col-acciones"></th>' : ''}</tr></thead>
        <tbody>
          ${usuarios.map(u => {
            // Nadie puede eliminarse a sí mismo (mismo candado que el backend,
            // ver DELETE /api/usuarios/:id) -- acá evita mostrar un botón que
            // de todas formas el servidor va a rechazar.
            const esUnoMismo = String(u.id) === String(miId);
            const botones = [
              puedeEditar ? `<button type="button" class="icon-btn" data-accion="editar" title="Editar">✏️</button>` : '',
              // Restablecer 2FA: para quien perdió el celular Y sus códigos de
              // recuperación. Nadie se lo restablece a sí mismo (ver el
              // backend: POST /api/usuarios/:id/reset-2fa) -- para eso está
              // "Desactivar" en Seguridad.
              (puedeEditar && u.tiene_2fa && !esUnoMismo) ? `<button type="button" class="icon-btn" data-accion="reset2fa" title="Restablecer verificación en dos pasos">🔓</button>` : '',
              puedeVerActividad ? `<button type="button" class="icon-btn" data-accion="actividad" title="Ver actividad">📋</button>` : '',
              (puedeEliminar && !esUnoMismo) ? `<button type="button" class="icon-btn peligro" data-accion="eliminar" title="Quitar acceso">🗑️</button>` : ''
            ].join('');
            // Sub-fase F: sucursal_id/sucursal_nombre ya vienen en GET
            // /api/usuarios desde la Sub-fase D -- null = sin restricción,
            // ve/opera en todas las sucursales de la empresa.
            const sucursalTexto = u.sucursal_id ? escapeHtml(u.sucursal_nombre) : 'Todas';
            return `
            <tr data-id="${u.id}">
              <td>${escapeHtml(u.nombre)}${u.tiene_2fa ? ' <span class="role-badge role-categoria" title="Verificación en dos pasos activada">🔐 2FA</span>' : ''}</td>
              <td>${escapeHtml(u.email)}</td>
              <td>${badgeRol(u.rol)}</td>
              <td>${sucursalTexto}</td>
              <td>${badgeEstado(u.activo)}</td>
              ${puedeAlgo ? `<td class="col-acciones"><div class="acciones-icono">${botones}</div></td>` : ''}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  cont.querySelectorAll('[data-accion="editar"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.closest('tr').dataset.id;
      const usuario = usuarios.find(u => String(u.id) === id);
      abrirEdicion(usuario);
    });
  });

  cont.querySelectorAll('[data-accion="reset2fa"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.closest('tr').dataset.id;
      const usuario = usuarios.find(u => String(u.id) === id);
      if (!confirm(`¿Restablecer la verificación en dos pasos de "${usuario.nombre}"?\n\nDejará de pedirle el código al iniciar sesión (solo su contraseña) hasta que la vuelva a activar desde Seguridad. Úsalo solo si perdió su celular y sus códigos de recuperación. Queda registrado en Auditoría.`)) return;
      btn.disabled = true;
      const res = await crearRegistro(config.apiBaseUrl, `usuarios/${id}/reset-2fa`, {});
      if (res) { cargarTabla(); return; }
      btn.disabled = false;
      alert(ultimoErrorAPI() || 'No se pudo restablecer la verificación en dos pasos.');
    });
  });

  cont.querySelectorAll('[data-accion="actividad"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.closest('tr').dataset.id;
      const usuario = usuarios.find(u => String(u.id) === id);
      abrirActividadUsuario(usuario);
    });
  });

  cont.querySelectorAll('[data-accion="eliminar"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.closest('tr').dataset.id;
      const usuario = usuarios.find(u => String(u.id) === id);
      if (!confirm(`¿Quitarle acceso a "${usuario.nombre}" a esta empresa? No se puede deshacer.`)) return;
      btn.disabled = true;
      const res = await eliminarRegistro(config.apiBaseUrl, 'usuarios', id);
      if (res) { cargarTabla(); return; }
      btn.disabled = false;
      alert(ultimoErrorAPI() || 'No se pudo eliminar el usuario.');
    });
  });
}

// Actividad reciente de un usuario puntual: reusa GET /auditoria (ya
// existía) con el filtro ?usuario_id= que se agregó junto con este
// rediseño -- antes solo se podía filtrar por módulo/fecha, no por quién.
async function abrirActividadUsuario(usuario) {
  abrirPanelLateral({
    titulo: `Actividad de ${usuario.nombre}`,
    icono: '📋',
    montar: async (body) => {
      body.innerHTML = '<div class="rank-row">Cargando…</div>';
      const sesion = obtenerSesion();
      let filas = [];
      try {
        const res = await fetch(`${config.apiBaseUrl}/auditoria?usuario_id=${usuario.id}&limite=15`, { headers: { Authorization: `Bearer ${sesion.token}` } });
        if (res.ok) filas = await res.json();
      } catch { /* sin conexión: se deja la lista vacía */ }

      const ETIQUETA_ACCION = { crear: 'Creó', editar: 'Editó', eliminar: 'Eliminó', importar: 'Importó' };
      body.innerHTML = filas.length ? filas.map(f => {
        const fecha = new Date(f.creado_el).toLocaleString('es-PE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        return `<div class="timeline-item">
          <span class="timeline-icono">📝</span>
          <div class="timeline-info">
            <div class="timeline-texto">${escapeHtml(ETIQUETA_ACCION[f.accion] || f.accion)} en ${escapeHtml(f.modulo || '')}</div>
            <div class="timeline-fecha">${escapeHtml(fecha)}</div>
          </div>
        </div>`;
      }).join('') : '<div class="rank-row">Sin actividad registrada todavía.</div>';
    }
  });
}

// Agrupa "ventas.ver", "ventas.crear", ... bajo "ventas" -- los nombres de
// permiso ya siguen esa convención en toda la base (ver backend/migrations/
// 005_roles_permisos.sql), no hace falta un mapeo aparte.
function agruparPermisos(permisos) {
  const grupos = new Map();
  (permisos || []).forEach(p => {
    const [modulo, accion] = p.split('.');
    if (!grupos.has(modulo)) grupos.set(modulo, []);
    grupos.get(modulo).push(accion || p);
  });
  return grupos;
}

function abrirPermisosRol(rol) {
  const grupos = agruparPermisos(rol.permisos);
  abrirPanelLateral({
    titulo: `Rol: ${rol.nombre}`,
    icono: '🔐',
    montar: (body) => {
      body.innerHTML = grupos.size
        ? [...grupos.entries()].map(([modulo, acciones]) => `
          <div class="rank-row">
            <span class="rank-name">${escapeHtml(modulo)}</span>
            <span class="rank-val" style="font-weight:400; font-size:12px; text-align:right;">${acciones.map(a => escapeHtml(a)).join(', ')}</span>
          </div>`).join('')
        : '<div class="rank-row">Este rol no tiene permisos asignados.</div>';
    }
  });
}

function dibujarRoles() {
  const cont = document.getElementById('rolesLista');
  if (!cont) return;
  cont.innerHTML = roles.length ? roles.map(r => `
    <div class="cliente-row" data-rol="${escapeHtml(r.nombre)}">
      <div class="cliente-row-info">
        <div class="cliente-row-nombre">${escapeHtml(r.nombre)}</div>
        <div class="cliente-row-contacto">${r.permisos.length} permiso(s)</div>
      </div>
    </div>
  `).join('') : '<div class="rank-row">Sin roles configurados.</div>';

  cont.querySelectorAll('.cliente-row').forEach(el => {
    el.addEventListener('click', () => {
      const rol = roles.find(r => r.nombre === el.dataset.rol);
      if (rol) abrirPermisosRol(rol);
    });
  });
}

// Distinto de "Administradores" (un solo número en los KPIs): acá se ve la
// composición completa por rol, no solo el más privilegiado.
function dibujarChartRol(usuarios) {
  const porRol = new Map();
  usuarios.forEach(u => { const r = u.rol || 'Sin rol'; porRol.set(r, (porRol.get(r) || 0) + 1); });
  const entradas = [...porRol.entries()].sort((a, b) => b[1] - a[1]);

  const wrap = document.getElementById('usrChartRolWrap');
  wrap.innerHTML = '<canvas id="usrChartRol"></canvas>';
  if (chartRol) { chartRol.destroy(); chartRol = null; }
  if (!entradas.length) { wrap.innerHTML = '<div class="chart-empty">Sin usuarios registrados.</div>'; return; }
  const ctx = document.getElementById('usrChartRol').getContext('2d');
  chartRol = crearGraficoDona(ctx, { etiquetas: entradas.map(e => e[0]), valores: entradas.map(e => e[1]) });
}

function dibujarChartEstado(usuarios) {
  const activos = usuarios.filter(u => u.activo).length;
  const inactivos = usuarios.length - activos;
  const entradas = [['Activos', activos], ['Inactivos', inactivos]].filter(([, n]) => n > 0);

  const wrap = document.getElementById('usrChartEstadoWrap');
  wrap.innerHTML = '<canvas id="usrChartEstado"></canvas>';
  if (chartEstado) { chartEstado.destroy(); chartEstado = null; }
  if (!entradas.length) { wrap.innerHTML = '<div class="chart-empty">Sin usuarios registrados.</div>'; return; }
  const COLOR = { 'Activos': '#0F6E56', 'Inactivos': '#C4544B' };
  const ctx = document.getElementById('usrChartEstado').getContext('2d');
  chartEstado = crearGraficoDona(ctx, { etiquetas: entradas.map(e => e[0]), valores: entradas.map(e => e[1]), colores: entradas.map(e => COLOR[e[0]]) });
}

// Crecimiento del equipo -- usa u.creado_el (sí existe en la respuesta de
// GET /api/usuarios, confirmado en backend/src/routes/usuarios.js).
function dibujarChartNuevos(usuarios) {
  const meses = ultimosNMeses(6);
  const conteoPorMes = new Map(meses.map(m => [m, 0]));
  usuarios.forEach(u => {
    if (!u.creado_el) return;
    const mes = String(u.creado_el).slice(0, 7);
    if (conteoPorMes.has(mes)) conteoPorMes.set(mes, conteoPorMes.get(mes) + 1);
  });

  const wrap = document.getElementById('usrChartNuevosWrap');
  wrap.innerHTML = '<canvas id="usrChartNuevos"></canvas>';
  if (chartNuevos) { chartNuevos.destroy(); chartNuevos = null; }
  const total = [...conteoPorMes.values()].reduce((s, n) => s + n, 0);
  if (!total) { wrap.innerHTML = '<div class="chart-empty">Sin altas de usuario en los últimos 6 meses.</div>'; return; }
  const color = getComputedStyle(document.documentElement).getPropertyValue('--teal').trim();
  const ctx = document.getElementById('usrChartNuevos').getContext('2d');
  chartNuevos = crearGraficoBarras(ctx, { etiquetas: meses.map(etiquetaMes), valores: meses.map(m => conteoPorMes.get(m)), label: 'Usuarios nuevos', color });
}

function dibujarChartsUsuarios(usuarios) {
  dibujarChartRol(usuarios);
  dibujarChartEstado(usuarios);
  dibujarChartNuevos(usuarios);
}

// Dónde se concentra el acceso a través de TODOS los roles configurados --
// distinto del panel "Roles y permisos" (que muestra el detalle de un rol a
// la vez, al hacer clic). Reusa la misma convención "modulo.accion" que
// agruparPermisos() ya usa para el panel lateral de un rol puntual.
function dibujarChartPermisos() {
  const porModulo = new Map();
  roles.forEach(r => {
    (r.permisos || []).forEach(p => {
      const [modulo] = p.split('.');
      if (!modulo) return;
      porModulo.set(modulo, (porModulo.get(modulo) || 0) + 1);
    });
  });
  const entradas = [...porModulo.entries()].sort((a, b) => b[1] - a[1]);

  const wrap = document.getElementById('usrChartPermisosWrap');
  wrap.innerHTML = '<canvas id="usrChartPermisos"></canvas>';
  if (chartPermisos) { chartPermisos.destroy(); chartPermisos = null; }
  if (!entradas.length) { wrap.innerHTML = '<div class="chart-empty">Sin roles configurados todavía.</div>'; return; }
  const color = getComputedStyle(document.documentElement).getPropertyValue('--purple').trim();
  const ctx = document.getElementById('usrChartPermisos').getContext('2d');
  chartPermisos = crearGraficoBarras(ctx, { etiquetas: entradas.map(e => e[0]), valores: entradas.map(e => e[1]), label: 'Permisos otorgados', color });
}

function abrirEdicion(usuario) {
  abrirPanelLateral({
    titulo: `Editar usuario`,
    icono: '👤',
    montar: (body) => {
      body.innerHTML = `
        <form class="form-registro" style="grid-template-columns:1fr;" id="formEditarUsuario">
          <div class="campo"><label>Nombre</label><input type="text" id="editNombre" value="${escapeHtml(usuario.nombre)}" required></div>
          <div class="campo"><label>Correo (no editable)</label><input type="text" value="${escapeHtml(usuario.email)}" disabled></div>
          <div class="campo"><label>Rol</label>
            <select id="editRol">${roles.map(r => `<option value="${r.nombre}" ${r.nombre === usuario.rol ? 'selected' : ''}>${r.nombre}</option>`).join('')}</select>
          </div>
          <div class="campo">
            <label>Sucursal</label>
            <select id="editSucursal">
              <option value="">Todas (sin restricción)</option>
              ${sucursales.map(s => `<option value="${s.id}" ${s.id === usuario.sucursal_id ? 'selected' : ''}>${escapeHtml(s.nombre)}</option>`).join('')}
            </select>
            <span style="font-size:11px; color:var(--muted); margin-top:4px; display:block;">Restringe a esta persona a ver y operar solo en esa sucursal (ventas, inventario, finanzas, cajas). "Todas" es lo de siempre.</span>
          </div>
          <div class="campo" style="flex-direction:row; align-items:center; gap:8px;">
            <input type="checkbox" id="editActivo" ${usuario.activo ? 'checked' : ''} style="width:auto;">
            <label style="text-transform:none; letter-spacing:normal;">Cuenta activa (una cuenta inactiva no puede iniciar sesión)</label>
          </div>
          <div class="campo campo-accion">
            <button type="submit" class="btn btn-ochre" style="width:100%; justify-content:center;">Guardar cambios</button>
            <span class="form-status" id="editStatus"></span>
          </div>
        </form>
      `;
      document.getElementById('formEditarUsuario').addEventListener('submit', async (e) => {
        e.preventDefault();
        const sucursalValor = document.getElementById('editSucursal').value;
        const cambios = {
          nombre: document.getElementById('editNombre').value.trim(),
          rol: document.getElementById('editRol').value,
          activo: document.getElementById('editActivo').checked,
          // '' ("Todas") -> null explícito, para que el backend lo trate
          // como "quitar la restricción" (ver PUT /api/usuarios/:id, patrón
          // "provisto": distingue "no mandado" de "mandado como null").
          sucursal_id: sucursalValor ? Number(sucursalValor) : null
        };
        const res = await actualizarRegistro(config.apiBaseUrl, 'usuarios', usuario.id, cambios);
        const statusEl = document.getElementById('editStatus');
        if (!res) { statusEl.textContent = 'No se pudo guardar el cambio.'; statusEl.style.color = 'var(--coral)'; return; }
        cerrarPanelLateral();
        cargarTabla();
      });
    }
  });
}

function abrirNuevoUsuario() {
  abrirPanelLateral({
    titulo: 'Nuevo usuario',
    icono: '👤',
    montar: (body) => {
      body.innerHTML = '<div id="formNuevoUsuario"></div>';
      renderFormulario('formNuevoUsuario', {
        etiqueta: 'usuario',
        campos: [
          { id: 'nombre', label: 'Nombre completo', type: 'text', required: true },
          { id: 'email', label: 'Correo', type: 'email', required: true },
          { id: 'password', label: 'Contraseña', type: 'password', required: true, placeholder: 'Mín. 8 caracteres, mayúscula, minúscula y número' },
          { id: 'rol', label: 'Rol', type: 'select', required: true, vacio: 'Selecciona un rol…',
            opcionesResueltas: roles.map(r => ({ value: r.nombre, label: r.nombre })) }
        ]
      }, async (valores) => {
        const res = await crearRegistro(config.apiBaseUrl, 'usuarios', valores);
        if (res) { cerrarPanelLateral(); cargarTabla(); }
        return res;
      }, { puedeCrear: true, obtenerUltimoError: ultimoErrorAPI });
    }
  });
}

(async function iniciar() {
  config = await cargarConfigEmpresa();
  renderSidebar(config, 'usuarios');
  renderGealmiAiWidget(config);
  await renderTopbar(config);
  renderFooter();

  if (!tienePermiso('usuarios.ver')) {
    document.getElementById('tablaUsuarios').innerHTML = '<p class="tabla-vacia">Tu rol no tiene permiso para ver esta sección.</p>';
    return;
  }

  roles = await pedirRoles();
  // Sin await a propósito: sucursales solo hace falta para el select del
  // panel de "Editar usuario", que se abre después (on-demand) -- no tiene
  // por qué demorar la carga de la tabla principal. roles SÍ se espera
  // arriba porque dibujarKpis()/dibujarChartPermisos() (dentro de
  // cargarTabla()) lo necesitan ya resuelto.
  pedirSucursales().then(s => { sucursales = s; });
  dibujarRoles();
  dibujarChartPermisos();

  const btnNuevo = document.getElementById('btnNuevoUsuario');
  if (tienePermiso('usuarios.crear')) {
    btnNuevo.style.display = 'inline-flex';
    btnNuevo.addEventListener('click', abrirNuevoUsuario);
  }

  cargarTabla();
})();
</script>
